# Study Buddy AI - docker-compose.yml
#
# Runs the whole application end-to-end: the Node/Express app plus its own
# MongoDB instance, networked together automatically by Docker Compose.
#
# Note on configuration: this project's only runtime secret is
# SESSION_SECRET, used to sign the Express session cookie. It is not a
# database password or third-party API key, and the MongoDB instance
# below is self-contained (local to this compose stack, not exposed
# publicly, no external credentials). A default value is provided below
# so the marker can run this with zero setup, as required. See the
# README "Configuration" section for more detail.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/studybuddy
      - SESSION_SECRET=${SESSION_SECRET:-studybuddy_dev_session_secret_2026}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
